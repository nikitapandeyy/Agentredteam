[pytest]
filterwarnings = ignore::pytest.PytestCollectionWarning
# Only collect files that START with test_ — this keeps pytest from
# picking up helper scripts like scripts/manual_test.py
python_files = test_*.py

# Always put the project root on the import path so "from app..." works
pythonpath = .

testpaths = tests

python_classes = Test[A-Z]*
collect_ignore_glob = []

markers =
    live: tests that make real LLM API calls (slow, uses quota)
